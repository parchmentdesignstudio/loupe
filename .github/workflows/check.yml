# Every push and pull request: lint, including the misuse of Loupe, the tests, the Elyx tokens against theme.css, and
# the built lib against its source, as lib is committed for sites that install from GitHub
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Built lib matches its source
        run: |
          pnpm --filter @parchment/ui build
          git diff --exit-code -- packages/ui/lib
